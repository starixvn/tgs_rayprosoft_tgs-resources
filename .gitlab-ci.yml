stages:
  - deploy-dev
  - deploy-staging
  - deploy-prod

deploy-dev:
  stage: deploy-dev
  before_script: 
    - export KUBECONFIG=$KubeConfig_Raypro_dev
    - echo "KUBECONFIG=$KUBECONFIG"
  environment:
    name: dev
  script:
    - kubectl apply -f dev/
      
deploy-staging:
  stage: deploy-staging
  before_script: 
    - export KUBECONFIG=$KubeConfig_Raypro_staging
    - echo "KUBECONFIG=$KUBECONFIG"
  environment:
    name: staging
  script:
    - kubectl apply -f staging/
    
deploy-prod:
  stage: deploy-prod
  before_script: 
    - export KUBECONFIG=$KubeConfig_Raypro_prod
    - echo "KUBECONFIG=$KUBECONFIG"
  environment:
    name: prod
  script:
    - kubectl apply -f prod/