stages:
  - deploy-dev
  - deploy-staging
  - deploy-prod

deploy-dev:
  stage: deploy-dev
  before_script: 
    - export KUBECONFIG=$KubeConfig_Raypro_dev
  environment:
    name: dev
  script:
    - kubectl apply -f dev/
  only: 
    - main
    
deploy-staging:
  stage: deploy-staging
  before_script: 
    - export KUBECONFIG=$KubeConfig_Raypro_staging
  environment:
    name: staging
  script:
    - kubectl apply -f staging/
  only: 
    - main
    
deploy-prod:
  stage: deploy-prod
  before_script: 
    - export KUBECONFIG=$KubeConfig_Raypro_prod
  environment:
    name: prod
  script:
    - kubectl apply -f prod/
  only: 
    - main