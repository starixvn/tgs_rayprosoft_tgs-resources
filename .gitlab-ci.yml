stages:
  - deploy-dev
  - deploy-staging
  - deploy-prod

deploy-dev:
  stage: deploy-dev
  before_script: 
    - export KUBECONFIG=$kubeconfig_dev
    - echo "KUBECONFIG=$KUBECONFIG"
  environment:
    name: dev
  script:
    - | 
      kubectl apply -f dev/autoscaling-setting.yaml
      kubectl apply -f dev/resources-setting.yaml
      kubectl apply -f dev/tgs-setting.yaml
      kubectl apply -f dev/tgs-connection.yaml
      
deploy-staging:
  stage: deploy-staging
  before_script: 
    - export KUBECONFIG=$kubeconfig_staging
    - echo "KUBECONFIG=$KUBECONFIG"
  environment:
    name: staging
  script:
    - | 
      kubectl apply -f staging/autoscaling-setting.yaml
      kubectl apply -f staging/resources-setting.yaml
      kubectl apply -f staging/tgs-setting.yaml
      kubectl apply -f staging/tgs-connection.yaml

deploy-prod:
  stage: deploy-prod
  before_script: 
    - export KUBECONFIG=$kubeconfig_prod
    - echo "KUBECONFIG=$KUBECONFIG"
  environment:
    name: prod
  script:
    - | 
      kubectl apply -f prod/autoscaling-setting.yaml
      kubectl apply -f prod/resources-setting.yaml
      kubectl apply -f prod/tgs-setting.yaml
      kubectl apply -f prod/tgs-connection.yaml